<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحلیل باغات خانواده</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-color: #f5f5f5;
            --container-bg: white;
            --text-color: #333;
            --heading-color: #2c3e50;
            --stat-bg: #ecf0f1;
            --stat-value-color: #2c3e50;
            --border-color: #ddd;
            --table-header-bg: #3498db;
            --table-header-color: white;
            --table-even-bg: #f2f2f2;
            --button-bg: #3498db;
            --button-hover-bg: #2980b9;
            --shadow-color: rgba(0,0,0,0.1);
        }

        .dark-theme {
            --bg-color: #1a1a2e;
            --container-bg: #2d3746;
            --text-color: #e0e0e0;
            --heading-color: #81c784;
            --stat-bg: #4a5568;
            --stat-value-color: #a5d6a7;
            --border-color: #4a5568;
            --table-header-bg: #2e7d32;
            --table-header-color: #e8f5e9;
            --table-even-bg: #4a5568;
            --button-bg: #2e7d32;
            --button-hover-bg: #388e3c;
            --shadow-color: rgba(0,0,0,0.3);
        }

        body {
            font-family: 'Tahoma', Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: var(--bg-color);
            color: var(--text-color);
            direction: rtl;
            transition: all 0.3s ease;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background-color: var(--container-bg);
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px var(--shadow-color);
            transition: all 0.3s ease;
        }
        h1, h2 {
            color: var(--heading-color);
            text-align: center;
            transition: all 0.3s ease;
        }
        .controls {
            display: flex;
            justify-content: center;
            margin: 20px 0;
            gap: 10px;
            flex-wrap: wrap;
        }
        select, button {
            padding: 8px 15px;
            border-radius: 5px;
            border: 1px solid var(--border-color);
            font-size: 16px;
            transition: all 0.3s ease;
        }
        select {
            background-color: var(--container-bg);
            color: var(--text-color);
        }
        button {
            background-color: var(--button-bg);
            color: white;
            border: none;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: var(--button-hover-bg);
        }
        .charts-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-around;
            gap: 20px;
            margin-top: 30px;
        }
        .chart-box {
            background-color: var(--container-bg);
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 5px var(--shadow-color);
            flex: 1 1 300px;
            min-width: 300px;
            transition: all 0.3s ease;
        }
        .stats {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: center;
            margin: 20px 0;
        }
        .stat-card {
            background-color: var(--stat-bg);
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            flex: 1;
            min-width: 150px;
            transition: all 0.3s ease;
        }
        .stat-value {
            font-size: 24px;
            font-weight: bold;
            color: var(--stat-value-color);
            transition: all 0.3s ease;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            border: 1px solid var(--border-color);
            padding: 10px;
            text-align: center;
            transition: all 0.3s ease;
        }
        th {
            background-color: var(--table-header-bg);
            color: var(--table-header-color);
        }
        tr:nth-child(even) {
            background-color: var(--table-even-bg);
        }
        .theme-toggle {
            position: absolute;
            left: 20px;
            top: 20px;
            background-color: var(--button-bg);
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s ease;
        }
        .theme-toggle:hover {
            background-color: var(--button-hover-bg);
        }
        @media (max-width: 768px) {
            .charts-container {
                flex-direction: column;
            }
            .theme-toggle {
                position: relative;
                left: auto;
                top: auto;
                margin-bottom: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <button class="theme-toggle" id="themeToggle">
            <i class="fas fa-moon"></i> تم تاریک
        </button>
        
        <h1>تحلیل باغات خانواده در مناطق مختلف</h1>
        
        <div class="controls">
            <select id="regionSelect">
                <option value="all">همه مناطق</option>
                <option value="منطقه 1">منطقه 1</option>
                <option value="منطقه 2">منطقه 2</option>
                <option value="منطقه 4">منطقه 4</option>
                <option value="منطقه 5">منطقه 5</option>
                <option value="منطقه 6">منطقه 6</option>
                <option value="منطقه 7">منطقه 7</option>
                <option value="منطقه 9">منطقه 9</option>
                <option value="منطقه 11">منطقه 11</option>
            </select>
            <button id="resetBtn">بازنشانی فیلتر</button>
        </div>
        
        <div class="stats">
            <div class="stat-card">
                <div>تعداد کل باغات</div>
                <div class="stat-value" id="totalGardens">11</div>
            </div>
            <div class="stat-card">
                <div>مساحت کل (مترمربع)</div>
                <div class="stat-value" id="totalArea">203,026</div>
            </div>
            <div class="stat-card">
                <div>میانگین مساحت (مترمربع)</div>
                <div class="stat-value" id="avgArea">18,457</div>
            </div>
            <div class="stat-card">
                <div>منطقه با بیشترین مساحت</div>
                <div class="stat-value" id="maxAreaRegion">منطقه 1</div>
            </div>
        </div>
        
        <div class="charts-container">
            <div class="chart-box">
                <h2>مساحت باغات بر اساس منطقه</h2>
                <canvas id="barChart"></canvas>
            </div>
            <div class="chart-box">
                <h2>سهم مناطق از کل مساحت</h2>
                <canvas id="pieChart"></canvas>
            </div>
        </div>
        
        <h2>جدول داده‌ها</h2>
        <table id="dataTable">
            <thead>
                <tr>
                    <th>منطقه</th>
                    <th>نوع باغ</th>
                    <th>آدرس</th>
                    <th>مساحت (مترمربع)</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <!-- داده‌ها توسط جاوااسکریپت پر می‌شوند -->
            </tbody>
        </table>
    </div>

    <script>
        // داده‌های اصلی
        const gardenData = [
            { region: "منطقه 1", type: "باغ خانواده", address: "باغ خانواده زرگري-كوچه 18 مطهري", area: 60000 },
            { region: "منطقه 2", type: "باغ خانواده", address: "باغ خانواده شمس-خيابان شمس تبريزي-كوچه33", area: 9900 },
            { region: "منطقه 4", type: "باغ خانواده", address: "باغ خانواده اميركبير-بلوار سرباز كوچه شماره 10", area: 6210 },
            { region: "منطقه 4", type: "باغ خانواده", address: "باغ خانواده كشن (اميركبير)-ابتداي مطهري جنوبي", area: 11862 },
            { region: "منطقه 5", type: "باغ خانواده", address: "باغ خانواده قبله-بلوار رحمت- بلوار سپاه جنوبي(قبله)", area: 3303 },
            { region: "منطقه 6", type: "باغ خانواده", address: "باغ بهار شيراز - بلوار چمران- بالاتر از اتوبانك شهر", area: 12000 },
            { region: "منطقه 6", type: "باغ خانواده", address: "باغ جماران -بلوار شهيد شريعتي - خيابان جماران", area: 28000 },
            { region: "منطقه 6", type: "باغ خانواده", address: "باغ خانواده اركيده - بلوار بهشت كوچه 8", area: 13700 },
            { region: "منطقه 6", type: "باغ خانواده", address: "باغ خانواده سلامت بانوان - چمران پياده راه سلامت", area: 21000 },
            { region: "منطقه 7", type: "باغ خانواده", address: "باغ خانواده - خليج فارس", area: 13740 },
            { region: "منطقه 9", type: "باغ خانواده", address: "باغ خانواده نهضت (سبحان)-بلوار طلاييه- شهرك سبحان-بلوار نهضت", area: 5437 },
            { region: "منطقه 11", type: "باغ خانواده", address: "باغ خانواده سرداران-بلوار سرداران- بلوار نصر - خيابان پاييزان", area: 14874 }
        ];

        // تنظیمات اولیه
        let filteredData = [...gardenData];
        let barChart, pieChart;

        // رنگ‌های مورد استفاده در نمودارها
        const colors = [
            '#3498db', '#2ecc71', '#e74c3c', '#f39c12', '#9b59b6',
            '#1abc9c', '#d35400', '#34495e', '#16a085', '#8e44ad'
        ];

        // آماده‌سازی داده‌ها برای نمودارها
        function prepareChartData(data) {
            const regions = [...new Set(data.map(item => item.region))];
            const regionAreas = {};
            
            regions.forEach(region => {
                const regionData = data.filter(item => item.region === region);
                regionAreas[region] = regionData.reduce((sum, item) => sum + item.area, 0);
            });
            
            return {
                labels: regions,
                datasets: [{
                    label: 'مساحت (مترمربع)',
                    data: regions.map(region => regionAreas[region]),
                    backgroundColor: colors.slice(0, regions.length),
                    borderColor: colors.slice(0, regions.length),
                    borderWidth: 1
                }]
            };
        }

        // ایجاد نمودار میله‌ای
        function createBarChart(data) {
            const ctx = document.getElementById('barChart').getContext('2d');
            const chartData = prepareChartData(data);
            
            if (barChart) {
                barChart.destroy();
            }
            
            barChart = new Chart(ctx, {
                type: 'bar',
                data: chartData,
                options: {
                    responsive: true,
                    plugins: {
                        legend: {
                            display: false
                        },
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    return `مساحت: ${context.parsed.y.toLocaleString()} مترمربع`;
                                }
                            }
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            title: {
                                display: true,
                                text: 'مساحت (مترمربع)'
                            }
                        }
                    }
                }
            });
        }

        // ایجاد نمودار دایره‌ای
        function createPieChart(data) {
            const ctx = document.getElementById('pieChart').getContext('2d');
            const chartData = prepareChartData(data);
            
            if (pieChart) {
                pieChart.destroy();
            }
            
            pieChart = new Chart(ctx, {
                type: 'pie',
                data: chartData,
                options: {
                    responsive: true,
                    plugins: {
                        legend: {
                            position: 'left',
                        },
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    const value = context.parsed;
                                    const total = context.dataset.data.reduce((a, b) => a + b, 0);
                                    const percentage = Math.round((value / total) * 100);
                                    return `${context.label}: ${value.toLocaleString()} مترمربع (${percentage}%)`;
                                }
                            }
                        }
                    }
                }
            });
        }

        // به‌روزرسانی جدول داده‌ها
        function updateTable(data) {
            const tableBody = document.getElementById('tableBody');
            tableBody.innerHTML = '';
            
            data.forEach(item => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${item.region}</td>
                    <td>${item.type}</td>
                    <td>${item.address}</td>
                    <td>${item.area.toLocaleString()}</td>
                `;
                tableBody.appendChild(row);
            });
        }

        // به‌روزرسانی آمار
        function updateStats(data) {
            const totalGardens = data.length;
            const totalArea = data.reduce((sum, item) => sum + item.area, 0);
            const avgArea = Math.round(totalArea / totalGardens);
            
            // پیدا کردن منطقه با بیشترین مساحت
            const regionAreas = {};
            data.forEach(item => {
                if (!regionAreas[item.region]) {
                    regionAreas[item.region] = 0;
                }
                regionAreas[item.region] += item.area;
            });
            
            let maxAreaRegion = '';
            let maxArea = 0;
            for (const region in regionAreas) {
                if (regionAreas[region] > maxArea) {
                    maxArea = regionAreas[region];
                    maxAreaRegion = region;
                }
            }
            
            document.getElementById('totalGardens').textContent = totalGardens.toLocaleString();
            document.getElementById('totalArea').textContent = totalArea.toLocaleString();
            document.getElementById('avgArea').textContent = avgArea.toLocaleString();
            document.getElementById('maxAreaRegion').textContent = maxAreaRegion;
        }

        // فیلتر داده‌ها بر اساس منطقه
        function filterData(region) {
            if (region === 'all') {
                filteredData = [...gardenData];
            } else {
                filteredData = gardenData.filter(item => item.region === region);
            }
            
            updateCharts();
            updateTable(filteredData);
            updateStats(filteredData);
        }

        // به‌روزرسانی همه نمودارها
        function updateCharts() {
            createBarChart(filteredData);
            createPieChart(filteredData);
        }

        // تغییر تم
        function toggleTheme() {
            const body = document.body;
            const themeToggle = document.getElementById('themeToggle');
            
            body.classList.toggle('dark-theme');
            
            if (body.classList.contains('dark-theme')) {
                themeToggle.innerHTML = '<i class="fas fa-sun"></i> تم روشن';
            } else {
                themeToggle.innerHTML = '<i class="fas fa-moon"></i> تم تاریک';
            }
        }

        // راه‌اندازی اولیه
        function init() {
            // ایجاد نمودارها با داده‌های اولیه
            updateCharts();
            updateTable(filteredData);
            updateStats(filteredData);
            
            // اضافه کردن event listener برای فیلتر منطقه
            document.getElementById('regionSelect').addEventListener('change', function() {
                filterData(this.value);
            });
            
            // اضافه کردن event listener برای دکمه بازنشانی
            document.getElementById('resetBtn').addEventListener('click', function() {
                document.getElementById('regionSelect').value = 'all';
                filterData('all');
            });
            
            // اضافه کردن event listener برای تغییر تم
            document.getElementById('themeToggle').addEventListener('click', toggleTheme);
        }

        // اجرای برنامه پس از بارگذاری صفحه
        window.onload = init;
    </script>
</body>
</html>
